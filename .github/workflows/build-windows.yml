name: Compilar .exe para Windows

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Empaquetar instalador y portable
        run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: NexusFarmer-windows
          path: |
            dist/*.exe
          if-no-files-found: error
      - name: Publicar release (solo en tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
      # Cada push a master deja los .exe en la release "ultima": siempre el mismo enlace de descarga.
      - name: Mover la etiqueta "ultima" a este commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: bash
        run: |
          git tag -f ultima
          git push -f origin refs/tags/ultima
      - name: Publicar en la release "ultima"
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima
          name: Nexus Farmer - última versión
          body: |
            Compilación automática de `${{ github.sha }}`.
            - **NexusFarmer-Setup-1.0.0.exe**: instalador.
            - **NexusFarmer-Portable-1.0.0.exe**: se abre sin instalar.
          make_latest: true
          overwrite_files: true
          files: dist/*.exe
