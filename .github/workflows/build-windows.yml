name: Compilar .exe para Windows

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Firma de código (quita el aviso de SmartScreen / "podría ser malicioso"). Se activa sola si existen
      # los secretos del repositorio; sin ellos se compila sin firmar. Ver docs/FIRMA.md.
      - name: Empaquetar instalador y portable
        shell: bash
        env:
          # Opción A: certificado .pfx (OV/EV) en base64 y su contraseña.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # Opción B: Azure Trusted Signing (Microsoft Artifact Signing).
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE }}
          AZURE_SIGN_PUBLISHER: ${{ vars.AZURE_SIGN_PUBLISHER }}
        run: |
          args=(--win --x64 --publish never)
          if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_SIGN_ENDPOINT" ]; then
            echo "Firmando con Azure Trusted Signing"
            args+=(-c.win.azureSignOptions.endpoint="$AZURE_SIGN_ENDPOINT"
                   -c.win.azureSignOptions.codeSigningAccountName="$AZURE_SIGN_ACCOUNT"
                   -c.win.azureSignOptions.certificateProfileName="$AZURE_SIGN_PROFILE"
                   -c.win.azureSignOptions.publisherName="$AZURE_SIGN_PUBLISHER")
          elif [ -n "$CSC_LINK" ]; then
            echo "Firmando con el certificado .pfx"
          else
            echo "::warning::Sin certificado de firma: Windows mostrará el aviso de SmartScreen. Ver docs/FIRMA.md"
          fi
          npx electron-builder "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: NexusFarmer-windows
          path: |
            dist/*.exe
          if-no-files-found: error
      - name: Publicar release (solo en tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
      # Cada push a master deja los .exe en la release "ultima": siempre el mismo enlace de descarga.
      - name: Mover la etiqueta "ultima" a este commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: bash
        run: |
          git tag -f ultima
          git push -f origin refs/tags/ultima
      - name: Publicar en la release "ultima"
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima
          name: Nexus Farmer - última versión
          body: |
            Compilación automática de `${{ github.sha }}`.
            - **NexusFarmer-Setup-1.0.0.exe**: instalador.
            - **NexusFarmer-Portable-1.0.0.exe**: se abre sin instalar.
          make_latest: true
          overwrite_files: true
          files: dist/*.exe
